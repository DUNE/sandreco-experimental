name: Build Sandreco (Docker)

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: baltig.infn.it:4567/dune/sand-ci/sand-dev-cpu:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir build
          cd build
          cmake -S .. -B .
          cmake --build . --parallel --target install
